load_offline_data: False
pre_train: False
disable_wandb: True
save_final_buffer: False
device: cpu
seed: 0
work_dir: outputs/first_sac_cpu_v3

Agent:
  num_steps: 10000
  start_steps: 5000
  batch_size: 64
  memory_size: 50000
  offline_buffer_size: 50000
  use_offline_buffer: False
  update_interval: 1
  log_interval: 10
  eval_interval: 10000
  num_eval_episodes: 3
  checkpoint_freq: 2000
  publish_every_updates: 100
  # Neuroévolution : population de candidats, générations, élitisme + mutation.
  # Remplace le PBT/SAC (pbt_enabled=false).
  pbt_enabled: false
  neuroevolution: true
  neuroevolution_population: 120
  neuroevolution_elitism: 2
  neuroevolution_parents: 10
  neuroevolution_mutation_rate: 0.05
  neuroevolution_mutation_intensity: 0.03
  # Extra action noise disabled: the policy output is used as-is.
  action_exploration_noise_std: 0
  action_exploration_throttle_bias: 0
  action_exploration_brake_bias: 0

SAC:
  gamma: 0.992
  nstep: 1
  policy_lr: 0.0001
  q_lr: 0.0001
  entropy_lr: 0.0001
  policy_hidden_units: [256, 256]
  q_hidden_units: [256, 256]
  target_update_coef: 0.005
  log_interval: 10

DisCor:
  error_lr: 0.0003
  error_hidden_units: [256, 256, 256, 256]
  tau_init: 10.0

AssettoCorsa:
  action_schema_version: normalized_policy_relu_v2
  reward_mode: signed_progress_v1
  reward_progress_per_m: 0.10
  reward_time_per_sec: 0.02
  reward_collision_penalty: 10
  reward_offtrack_per_step: 0.3
  reward_smoothness_coef: 0.005
  reward_step_cost: 0.005
  reward_idle_speed_kmh: 3
  reward_motion_per_kmh: 0
  reward_n_sectors: 4
  reward_clean_sector_bonus: 1
  reward_clean_lap_bonus: 20
  reward_clean_lap_time_ref_sec: 150
  ego_sampling_freq: 25
  max_episode_py_time: 30
  gap_const: 12.
  eval_number_of_laps: 4
  save_lap_csv: False
  remote_machine_ip: "localhost"
  ego_server_port: 2345
  opponents_server_port: 2346
  simulation_management_server_port: 2347
  use_relative_actions: False
  enable_sensors: True
  vjoy_executed_by_server: False
  enable_out_of_track_termination: False
  enable_low_speed_termination: False
  recover_car_on_done: False
  send_reset_at_start: True
  record_controls_from_client: False
  enable_out_of_track_penalty: False
  max_laps_number: null
  enable_task_id_in_obs: False
  penalize_actions_diff: False
  penalize_actions_diff_coef: 0.1
  max_steer_rate: 900.0
  track: monza
  car: lotus_exos_125
  use_ac_out_of_track: False
  oot_mode: local_gap
  oot_gap_m: 12.0
  oot_soft_gap_m: 8.0
  add_previous_obs_to_state: False
  use_reference_line_in_reward: True
  use_target_speed: False
  screen_capture_enable: False
  final_image_width: 320
  final_image_height: 240
  color_mode: "gray"
  use_obs_extra: False
  safe_training_mode: True
  auto_shift_to_first: True
  safe_acc_pedal_max: 1.0
  safe_brake_pedal_max: 1.0
  # Soft throttle ramp: ~0.4s 0→100% at 25 Hz. Full gas still allowed.
  acc_max_delta_pedal: 0.10
  # Brake can slam to 100%; slightly faster ramp than throttle.
  brake_max_delta_pedal: 0.25
  safe_steer_deg: 90.0
  steer_control_v3: True
  exploration_v3: True
  steer_limit_deg: 90.0
  # Faster direction changes so the car can leave a hard-left local optimum.
  steer_max_delta_deg: 6.0
  steer_soft_zone_deg: 1.0
  steer_center_deadband_deg: 1.0
  steer_center_decay: 0.5
  low_speed_grace_sec: 12.0
  low_speed_timeout_sec: 6.0
  low_speed_threshold_kmh: 1.0
  oot_grace_sec: 3.0
  oot_hold_sec: 1.5
  wrong_way_timeout_sec: 100000
  wrong_way_speed_kmh: 8.0
  wrong_way_confirm_m: 8.0
  stuck_timeout_sec: 3.0
  stuck_speed_kmh: 6.0
  stuck_move_eps_m: 3.0
  no_progress_timeout_sec: 8.0
  no_progress_credit_m: 2.0
  moved_speed_kmh: 8.0
  reward_v3: True
  reward_gap_penalty_coef: 0.03
  reward_gap_penalty_cap: 0.3
  reward_steer_penalty_coef: 0.01
  reward_oot_terminal_penalty: 2
  reward_idle_penalty: 0.08
  reward_brake_penalty_coef: 0
  reward_brake_penalty_speed_kmh: 40
  reward_wrong_way_steer_coef: 0.2
  # Smooth gap factor: progress never reaches zero even far from line.
  # Lorentzian 1/(1+(|gap|/sigma)^2) — sigma=8 gives 50% at |gap|=8.
  reward_gap_factor_sigma: 8
  # Positive reward for proximity to racing line (carrot, not stick).
  reward_centerline_bonus_coef: 0.08
  reward_centerline_bonus_width: 12
  # Positive reward for steering TOWARD the line (opposite sign gap×steer).
  reward_correct_steer_bonus_coef: 0.1
